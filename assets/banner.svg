<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1147"/>
      <stop offset="1" stop-color="#0b3b5e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#7ee7ff"/>
      <stop offset="0.5" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#ff8ad8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7ee7ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7ee7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- floating particles -->
  <g fill="#b79cff" opacity="0.6">
    <circle cx="120" cy="40" r="2"><animate attributeName="cy" values="40;20;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="295" r="2.5"><animate attributeName="cy" values="295;275;295" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="45" r="2"><animate attributeName="cy" values="45;25;45" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="295" r="3"><animate attributeName="cy" values="295;275;295" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="265" r="2"><animate attributeName="cy" values="265;245;265" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left: text -->
  <text x="60" y="115" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#title)">
    Vaishnavi Kanade
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="62" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">
    Software Engineer
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- rotating "typing" lines -->
  <g font-family="'Courier New', Consolas, monospace" font-size="20" fill="#7ee787">
    <text x="62" y="208" opacity="0">&gt; Java • Android • Full-Stack Development
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="208" opacity="0">&gt; B.E. Information Technology (2026)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.63;0.68;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="208" opacity="0">&gt; ESDS Software Solutions
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- tech chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3">
    <rect x="60" y="238" width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="76" y="257">Java</text>
    <rect x="132" y="238" width="56" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="148" y="257">C++</text>
    <rect x="198" y="238" width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="214" y="257">MYSQL</text>
    <rect x="274" y="238" width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="290" y="257">DSA</text>
    <rect x="368" y="238" width="86" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="384" y="257">Android</text>
    <rect x="464" y="238" width="56" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="480" y="257">AWS</text>
  </g>

  <!-- right: full-stack architecture with moving data packets -->
  <circle cx="940" cy="165" r="170" fill="url(#glow)"/>

  <g stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.75">
    <line x1="850" y1="96" x2="880" y2="96" stroke="#7ee7ff"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="96" x2="1030" y2="96" stroke="#7ee7ff"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="790" y1="130" x2="790" y2="195" stroke="#7ee7ff"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="940" y1="130" x2="940" y2="195" stroke="#b79cff"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="1090" y1="130" x2="1090" y2="195" stroke="#7ee787"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="730" y="62" width="120" height="68" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#36bcf7" stroke-width="1.5"/>
    <text x="790" y="92" font-size="15" font-weight="700" fill="#7ee7ff">Client</text>
    <text x="790" y="113" font-size="11" fill="#c9d1d9">DSA · Android</text>

    <rect x="880" y="62" width="120" height="68" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#b79cff" stroke-width="1.5"/>
    <text x="940" y="92" font-size="15" font-weight="700" fill="#b79cff">Server</text>
    <text x="940" y="113" font-size="11" fill="#c9d1d9">Java · C++ · PHP</text>

    <rect x="1030" y="62" width="120" height="68" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#7ee787" stroke-width="1.5"/>
    <text x="1090" y="92" font-size="15" font-weight="700" fill="#7ee787">Database</text>
    <text x="1090" y="113" font-size="11" fill="#c9d1d9">MySQL · Firebase</text>

    <rect x="730" y="195" width="420" height="58" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ff8ad8" stroke-width="1.5"/>
    <text x="940" y="221" font-size="15" font-weight="700" fill="#ff8ad8">Cloud</text>
    <text x="940" y="240" font-size="11" fill="#c9d1d9">AWS · Cloud Foundations &amp; Architecting</text>

    <text x="940" y="287" font-size="12" fill="#8b949e">Full-Stack · Mobile · Cloud · AI</text>
  </g>

  <!-- moving data packets -->
  <g fill="#ffffff">
    <circle r="4" cy="96"><animate attributeName="cx" values="740;1140" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle r="4" cy="96"><animate attributeName="cx" values="740;1140" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cx="790"><animate attributeName="cy" values="130;195" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cx="940"><animate attributeName="cy" values="130;195" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" cx="1090"><animate attributeName="cy" values="130;195" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
