<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1147"/>
      <stop offset="1" stop-color="#0b3b5e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#7ee7ff"/>
      <stop offset="0.5" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#ff8ad8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7ee7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ee7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- floating particles -->
  <g fill="#b79cff" opacity="0.6">
    <circle cx="120" cy="40" r="2"><animate attributeName="cy" values="40;20;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="290" r="2.5"><animate attributeName="cy" values="290;270;290" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="2"><animate attributeName="cy" values="50;30;50" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="290" r="3"><animate attributeName="cy" values="290;270;290" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="260" r="2"><animate attributeName="cy" values="260;240;260" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left: text -->
  <text x="60" y="115" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#title)">
    Vaishnavi Kanade
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="62" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">
    Software Developer in the making
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- rotating "typing" lines -->
  <g font-family="'Courier New', Consolas, monospace" font-size="20" fill="#7ee787">
    <text x="62" y="208" opacity="0">&gt; RAG • Multi-Agent Systems • NLP
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="208" opacity="0">&gt; B.E. Information Technology (2026)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.63;0.68;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="62" y="208" opacity="0">&gt; QA Intern @ ESDS Software Solutions
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- tech chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3">
    <rect x="60" y="238" width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="76" y="257">Java</text>
    <rect x="132" y="238" width="76" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="148" y="257">Python</text>
    <rect x="218" y="238" width="96" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="234" y="257">LangGraph</text>
    <rect x="324" y="238" width="88" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="340" y="257">Pinecone</text>
    <rect x="422" y="238" width="52" height="28" rx="14" fill="#ffffff" fill-opacity="0.1"/><text x="438" y="257">AWS</text>
  </g>

  <!-- right: multi-agent network -->
  <circle cx="950" cy="160" r="150" fill="url(#glow)"/>
  <g stroke="#7ee7ff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" fill="none">
    <line x1="950" y1="160" x2="830" y2="70"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="950" y1="160" x2="1070" y2="60"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="950" y1="160" x2="1100" y2="205"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="950" y1="160" x2="960" y2="275"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="950" y1="160" x2="820" y2="215"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">
    <g><circle cx="830" cy="70" r="12" fill="#36bcf7"><animate attributeName="r" values="12;15;12" dur="2.4s" repeatCount="indefinite"/></circle><text x="830" y="102">Compliance</text></g>
    <g><circle cx="1070" cy="60" r="12" fill="#f7b236"><animate attributeName="r" values="12;15;12" dur="2.9s" repeatCount="indefinite"/></circle><text x="1070" y="92">Finance</text></g>
    <g><circle cx="1100" cy="205" r="12" fill="#7ee787"><animate attributeName="r" values="12;15;12" dur="2.2s" repeatCount="indefinite"/></circle><text x="1100" y="237">Operations</text></g>
    <g><circle cx="960" cy="275" r="12" fill="#ff8ad8"><animate attributeName="r" values="12;15;12" dur="3.1s" repeatCount="indefinite"/></circle><text x="960" y="308">Report</text></g>
    <g><circle cx="820" cy="215" r="12" fill="#b79cff"><animate attributeName="r" values="12;15;12" dur="2.6s" repeatCount="indefinite"/></circle><text x="820" y="247">Retriever</text></g>
    <g>
      <circle cx="950" cy="160" r="26" fill="none" stroke="#7ee7ff" stroke-width="2">
        <animate attributeName="r" values="26;46" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="160" r="26" fill="#0b1020" stroke="#7ee7ff" stroke-width="2"/>
      <text x="950" y="165" font-weight="700" font-size="14" fill="#7ee7ff">RAG</text>
    </g>
  </g>
</svg>
